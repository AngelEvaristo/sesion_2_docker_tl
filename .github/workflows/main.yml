name: Build and push image Java Spring Boot
on:
  workflow_dispatch: {}

permissions:
  id-token: write
  contents: read

jobs:

    extract-version:
        runs-on: ubuntu-latest
        outputs:
          app_version: ${{ steps.extract_version.outputs.VERSION }}
        steps:
        - name: Checkout code
          uses: actions/checkout@v3
        - name: Get Version from changelog
          id: extract_version
          run: |
            VERSION=$(grep -oPm1 "(?<=## \[)[^]]+" CHANGELOG.md)
            echo "Extracted version: $VERSION"
            echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

    build:
        name: Build and push Docker image
        needs: extract-version
        runs-on: ubuntu-latest
        steps:
        - name: Checkout code
          uses: actions/checkout@v3

        - name: Print version
          run: |
           echo "Version: ${{ needs.extract-version.outputs.app_version }}"

        - name: Configure ACR credentials
          uses: azure/docker-login@v1
          with:
            login-server: ${{ secrets.ACR_LOGIN_SERVER }}
            username: ${{ secrets.ACR_USERNAME }}
            password: ${{ secrets.ACR_PASSWORD }}

        - name: Build, tag, and push Docker image to ACR
          env:
            IMAGE_TAG: ${{ needs.extract-version.outputs.app_version }}
            ACR_REPOSITORY: testsesion2tl
            ACR_REGISTRY: ${{ secrets.ACR_LOGIN_SERVER }}
          run: |
            docker build -t $ACR_REGISTRY/$ACR_REPOSITORY:$IMAGE_TAG .
            docker push $ACR_REGISTRY/$ACR_REPOSITORY:$IMAGE_TAG
            docker images
    
